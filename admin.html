<!DOCTYPE html>
 <html lang="th">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>จัดการเรื่องร้องเรียน — เจ้าหน้าที่</title>
   <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
   <style>
     * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Noto Sans Thai", sans-serif, Arial; }
     body { background: #f0f4f8; min-height: 100vh; }
     
     /* Header */
     .header { background: #008891; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
     .header h1 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
     .back-link { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; transition: background 0.2s; }
     .back-link:hover { background: rgba(255,255,255,0.3); }
     
     /* Stats Bar */
     .stats-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 16px; background: white; border-bottom: 1px solid #e2e8f0; }
     .stat-item { text-align: center; }
     .stat-item .num { font-size: 22px; font-weight: bold; color: #008891; }
     .stat-item .label { font-size: 12px; color: #64748b; margin-top: 2px; }
     
     /* Content */
     .container { padding: 16px; max-width: 600px; margin: 0 auto; }
     
     /* Filter */
     .filter-bar { background: white; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
     .filter-bar label { font-size: 14px; color: #475569; font-weight: 500; }
     select { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: white; }
     
     /* Complaint Card */
     .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); border-left: 4px solid #008891; transition: transform 0.2s; }
     .card:hover { transform: translateY(-2px); }
     .card.unread { border-left-color: #f59e0b; }
     .card.done { border-left-color: #10b981; opacity: 0.9; }
     
     .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
     .card-title { font-size: 15px; font-weight: 600; color: #1e293b; }
     .card-date { font-size: 12px; color: #94a3b8; margin-top: 2px; }
     
     .card-body p { font-size: 14px; color: #475569; margin-bottom: 4px; line-height: 1.5; }
     .card-body strong { color: #334155; }
     
     .status-row { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
     
     .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
     .status.pending { background: #fef3c7; color: #92400e; }
     .status.working { background: #dbeafe; color: #1e40af; }
     .status.done { background: #d1fae5; color: #065f46; }
     
     .empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
     .empty svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.3; }
     
     .loading { text-align: center; padding: 40px; color: #64748b; }
   </style>
 </head>
 <body>
   <div class="header">
     <h1>📋 รายการเรื่องร้องเรียน</h1>
     <a href="index.html" class="back-link">← กลับหน้าแรก</a>
   </div>
   <div class="stats-bar">
     <div class="stat-item">
       <div class="num" id="statTotal">--</div>
       <div class="label">ทั้งหมด</div>
     </div>
     <div class="stat-item">
       <div class="num" id="statPending">--</div>
       <div class="label">รอดำเนินการ</div>
     </div>
     <div class="stat-item">
       <div class="num" id="statDone">--</div>
       <div class="label">เสร็จสิ้น</div>
     </div>
   </div>
   <div class="container">
     <div class="filter-bar">
       <label>กรองสถานะ:</label>
       <select id="filterStatus" onchange="applyFilter()">
         <option value="all">ทั้งหมด</option>
         <option value="รอดำเนินการ">รอดำเนินการ</option>
         <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
         <option
